# Docker Swarm stack for the yore sync server.
#
#   docker build -f docker/Dockerfile -t yore:latest .
#   docker stack deploy -c docker/swarm/stack.yml yore
#
# This is a Swarm stack, not a compose file: deploy it with `docker stack
# deploy`, not `docker compose up` (compose ignores `deploy:` and can't read the
# external Swarm secret/network below). For a local, non-Swarm playground use
# docker/sandbox/ instead.
#
# The server stores only ciphertext + device public keys; TLS terminates at
# your existing reverse proxy (attach this service to its network and add
# your proxy's labels/config under deploy.labels). The `proxy` network below is
# your reverse proxy's existing overlay network: create it (or rename this to
# match) before deploying:  docker network create --driver overlay proxy
#
# The server runs in ONE of two modes: pick one, they are mutually exclusive
# and setting both is a startup error:
#
# 1. Single tenant (the default below). Create its token secret once:
#      openssl rand -base64 32 | docker secret create yore_token -
#    Its db is /data/yore.db and its backups /data/backups/default/.
#
# 2. Named tenants. Each is an isolated db at /data/tenants/<name>.db,
#    unreachable by any other tenant's token, with backups in
#    /data/backups/<name>/. Nothing is stored at /data/yore.db in this mode.
#    Mount a JSON object of {"name":"token", …} as a secret, point
#    YORE_TOKENS_FILE at it, and remove YORE_TOKEN_FILE (and its secret):
#      printf '{"alice":"%s","bob":"%s"}' "$(openssl rand -base64 32)" \
#        "$(openssl rand -base64 32)" | docker secret create yore_tokens -
#
# In both modes the client and wire protocol are unchanged; the server routes
# purely by the identity that signed the request.
#
# One thing to do before the first deploy: the image runs as nonroot (uid
# 65532) and a fresh volume arrives owned by root, so the server cannot create
# its database until something claims it. On the node that will hold the
# volume:
#   docker volume create yore_yore-data
#   docker run --rm -v yore_yore-data:/data busybox chown 65532:65532 /data
# It is a one-time step; docker/compose/compose.yml does the same thing with a
# one-shot service, which Swarm has no equivalent of.
version: "3.8"

services:
  yore:
    image: yore:latest
    environment:
      # Mode 1: one tenant. For mode 2, delete this line and uncomment the next.
      YORE_TOKEN_FILE: /run/secrets/yore_token
      # Mode 2; named tenants (see the note above). Never set both:
      # YORE_TOKENS_FILE: /run/secrets/yore_tokens
      # Rolling per-tenant backups to /data/backups/<tenant>/ (defaults shown;
      # set the interval to 0 to disable):
      # YORE_BACKUP_INTERVAL: 1h
      # YORE_BACKUP_KEEP: "3"
    secrets:
      - yore_token
      # - yore_tokens
    volumes:
      - yore-data:/data
    networks:
      - proxy
    # Liveness only. /v1/health touches no database on purpose: a restart is the
    # only thing this can do, and the failure it must NOT trigger on is a full or
    # read-only /data: the server still serves reads there, and restarting it
    # into a volume it cannot write turns that into a crash loop. For "is it
    # still accepting history?" point monitoring at GET /v1/ready, which commits
    # a probe transaction and answers 503 when storage is gone (`yore doctor`
    # asks it too).
    healthcheck:
      test: ["CMD", "/yore", "healthcheck", "--url", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1 # bbolt is single-owner: exactly one replica, ever

volumes:
  yore-data:

secrets:
  yore_token:
    external: true
  # yore_tokens:
  #   external: true

networks:
  proxy:
    external: true
