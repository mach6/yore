# yore sandbox — a self-contained 3-container playground:
#   server   the sync server (ciphertext only), on the internal network
#   zsh      a client with zsh + yore hooks (hostname zsh-box)
#   bash     a client with bash + yore hooks (hostname bash-box)
#
# Clients reach the server over the internal Docker network (plain HTTP — no TLS
# needed inside the sandbox; per-device request signing authenticates everything).
# Nothing is published to the host.
#
# NOTE: server-data is a persistent volume, and a group that already has an
# active device refuses the bootstrap token by design. Since sandbox clients are
# ephemeral, their device keys vanish with the containers and nothing is left to
# mint an enrolment ticket — so ALWAYS reset with `docker compose down -v`
# (not plain `down`) before bringing the sandbox back up.
#
#   cd docker/sandbox
#   docker compose up -d --build
#   # then see README.md for the enroll + test walkthrough
name: yore-sandbox

services:
  server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    # The distroless image runs as nonroot; a fresh named volume is root-owned,
    # so run the sandbox server as root to write /data. (In production, give the
    # volume nonroot ownership instead of running as root.)
    user: "0:0"
    environment:
      YORE_TOKEN: sandbox-token
    volumes:
      - server-data:/data
    networks: [yore]

  zsh:
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile.client
    hostname: zsh-box
    init: true  # tini reaps orphaned shell-hook processes; sleep infinity cannot
    environment:
      YORE_SERVER: http://server:8080
      # The bootstrap ticket. It enrols only the FIRST machine: once any device
      # is active the server refuses it, and further machines need a ticket from
      # `yore devices ticket`.
      YORE_TICKET: sandbox-token
      YORE_INTEGRATION: takeover
    depends_on: [server]
    networks: [yore]
    tty: true
    stdin_open: true

  bash:
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile.client
    hostname: bash-box
    init: true  # tini reaps orphaned shell-hook processes; sleep infinity cannot
    environment:
      YORE_SERVER: http://server:8080
      # The bootstrap ticket. It enrols only the FIRST machine: once any device
      # is active the server refuses it, and further machines need a ticket from
      # `yore devices ticket`.
      YORE_TICKET: sandbox-token
      YORE_INTEGRATION: takeover
    depends_on: [server]
    networks: [yore]
    tty: true
    stdin_open: true

volumes:
  server-data:

networks:
  yore:
