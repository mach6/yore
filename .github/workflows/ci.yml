---
# The gates live in the Makefile; this file only provisions a runner and calls
# them, so `make ci` locally runs what CI runs.
name: ci

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install yamllint
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          python3 -m pip install --user yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make yamllint

  # Lint and test run beside yamllint; the image is only built once all three
  # pass.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make tools
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make tools
      - run: make test
      - run: make coverage-check

  docker:
    needs: [yamllint, lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # A repository variable REGISTRY overrides the default of the GitHub
      # container registry under the repository owner; REGISTRY_USER and
      # REGISTRY_PASSWORD secrets override the workflow's own token.
      REGISTRY: ${{ vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER || github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      IMAGE_TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          # git describe needs the tags to stamp the version.
          fetch-depth: 0
      - run: make build-docker
      - run: make test-docker
      - name: Log in to the registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: >-
          echo "$REGISTRY_PASSWORD"
          | docker login -u "$REGISTRY_USER" --password-stdin "${REGISTRY%%/*}"
      - name: Push the main build
        if: github.ref == 'refs/heads/main'
        run: make push-docker PUSH_TAGS=latest-build
      - name: Push the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: make push-docker PUSH_TAGS="${GITHUB_REF_NAME#v} latest"
